<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Girard Property Limited. Digital property management and cross-border swaps on one governed platform, across Nigeria, the UK and beyond. Managed with discipline, moved without borders." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0A1A38" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Girard" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Girard Property Limited</title>
    <!--
      three.js for the homepage hero, loaded from a CDN rather than added to
      package.json so the build is untouched. It is deliberately NOT deferred
      as a module: the hero checks for window.THREE and simply renders the
      plain navy section if this has not loaded, so a CDN failure costs the
      animation and nothing else.
    -->
    <!-- three.js is no longer loaded here. HeroTower and SwapModel fetch it
         from cdnjs only when a scene mounts, so pages without a scene, the
         signed-in portal and the static pages skip the 600KB entirely. -->
    <!-- Vercel Web Analytics, production host only so previews and local
         builds do not try to load it. Does nothing until Analytics is switched
         on for the project in the Vercel dashboard. -->
    <script>
      if (/girardpropertylimited\.com$/.test(location.hostname)) {
        var s = document.createElement("script"); s.defer = true; s.src = "/_vercel/insights/script.js"; document.head.appendChild(s);
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
